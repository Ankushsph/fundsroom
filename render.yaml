# Render Blueprint specification for Fundsroom Mini ERP + CRM Portal
# Learn more: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # Backend Web Service (Node.js + Express + Prisma)
  # -------------------------------------------------------------
  - type: web
    name: fundsroom-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: fundsroom-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://fundsroom-frontend.onrender.com

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: fundsroom-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fundsroom-backend.onrender.com/api

databases:
  # -------------------------------------------------------------
  # PostgreSQL Database (Render Postgres)
  # -------------------------------------------------------------
  - name: fundsroom-db
    databaseName: fundsroom_erp
    user: fundsroom_user
    plan: free
